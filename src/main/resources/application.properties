# Server
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.max-size=16

# Logs
quarkus.log.level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}"
quarkus.log.category."io.quarkus.resteasy.reactive.server.core".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive.common.core".level=DEBUG
quarkus.log.category."io.quarkus.resteasy.reactive.server".level=DEBUG
quarkus.log.category."io.quarkus.resteasy.reactive.server.handlers".level=DEBUG
quarkus.log.category."io.quarkus.resteasy.reactive.server.runtime".level=DEBUG
quarkus.log.category."io.quarkus".level=DEBUG
quarkus.log.category."javax".level=DEBUG
quarkus.log.category."org.hibernate".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n

