# JWT
mp.jwt.verify.publickey.location=publicKey.pem 
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.native.resources.includes=publicKey.pem,privateKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:sliceisright}
smallrye.jwt.new-token.key-encryption-algorithm=RSA-OAEP-256
smallrye.jwt.new-token.content-encryption-algorithm=A256CBC-HS512
quarkus.smallrye-jwt.blocking-authentication=true

# Oauth
quarkus.oauth2.client-id=${OAUTH_CLIENT_ID:client}
quarkus.oauth2.client-secret=${OAUTH_CLIENT_SECRET:secret}
quarkus.oauth2.introspection-url=http://oauth-server/introspect
quarkus.oidc.application-type=hybrid