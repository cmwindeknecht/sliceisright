quarkus.datasource.db-kind=h2  # You can replace with MySQL, PostgreSQL, etc.
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1  # H2 in-memory DB for dev
quarkus.datasource.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=password

quarkus.http.port=8080   # Port to run the app on

# Enable logging to the console for development
quarkus.log.console.level=DEBUG