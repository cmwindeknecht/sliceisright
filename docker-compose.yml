services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: slice
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.builder
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: local
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/slice
      SUPABASE_DB_USER: pizza
      SUPABASE_DB_PASSWORD: secret
      FRONTEND_ORIGINS: http://localhost:3000
      ADMIN_SETUP_TOKEN: "admintoken"
      JWT_SIGNING_KEY: abcdefghijklmnopqrstuvwxyz123456
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
