services:
  db:
    image: postgres:16
    container_name: slice-db
    environment:
      - POSTGRES_USER=pizza
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=slice
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: sliceisright-backend
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.builder
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_PROFILE=local
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/slice
      - QUARKUS_DATASOURCE_USERNAME=pizza
      - QUARKUS_DATASOURCE_PASSWORD=secret
      - JAVA_OPTS_APPEND=-Dquarkus.http.host=0.0.0.0
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
      - db

volumes:
  db_data:
